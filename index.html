<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة جلب أكواد المواقع</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            padding: 20px;
        }
        input, textarea, button {
            width: 80%;
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        textarea {
            height: 100px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
        }
        button {
            background-color: #00aaff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0088cc;
        }
    </style>
</head>
<body>

    <h1>أداة جلب أكواد المواقع</h1>
    <input type="text" id="urlInput" placeholder="أدخل رابط الموقع">
    <button onclick="fetchWebsiteCode()">إرسال</button>

    <h2>كود HTML:</h2>
    <textarea id="htmlCode" readonly></textarea>
    <button onclick="copyText('htmlCode')">نسخ HTML</button>
    <button onclick="previewHTML()">معاينة</button>

    <h2>كود CSS:</h2>
    <textarea id="cssCode" readonly></textarea>
    <button onclick="copyText('cssCode')">نسخ CSS</button>

    <h2>كود JavaScript:</h2>
    <textarea id="jsCode" readonly></textarea>
    <button onclick="copyText('jsCode')">نسخ JavaScript</button>

    <h2>All Web (ملف HTML كامل):</h2>
    <textarea id="allWebCode" readonly></textarea>
    <button onclick="copyText('allWebCode')">نسخ All Web</button>
    <button onclick="previewAllWeb()">معاينة</button>

    <script>
        const apiKey = "476c34e4da724c3eb2958291ea60e107b1df11c9706";

        function fetchWebsiteCode() {
            const url = document.getElementById("urlInput").value;
            if (!url) {
                alert("الرجاء إدخال رابط الموقع!");
                return;
            }

            fetch(`https://api.scrape.do?token=${apiKey}&url=${encodeURIComponent(url)}`)
                .then(response => response.text())
                .then(data => {
                    document.getElementById("htmlCode").value = data;
                    extractCSS_JS(data);
                    generateAllWeb();
                })
                .catch(error => console.error("حدث خطأ:", error));
        }

        function extractCSS_JS(html) {
            const cssMatches = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)];
            const jsMatches = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];

            document.getElementById("cssCode").value = cssMatches.length ? cssMatches.map(m => m[1]).join("\n") : "لا يوجد CSS داخلي";
            document.getElementById("jsCode").value = jsMatches.length ? jsMatches.map(m => m[1]).join("\n") : "لا يوجد JavaScript داخلي";
        }

        function generateAllWeb() {
            const htmlContent = document.getElementById("htmlCode").value;
            const cssContent = document.getElementById("cssCode").value;
            const jsContent = document.getElementById("jsCode").value;

            const fullHTML = `<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الموقع</title>
    <style>${cssContent}</style>
</head>
<body>
    ${htmlContent}
    <script>${jsContent}<\/script>
</body>
</html>`;

            document.getElementById("allWebCode").value = fullHTML;
        }

        function copyText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand("copy");
            alert("تم النسخ!");
        }

        function previewHTML() {
            const htmlCode = document.getElementById("htmlCode").value;
            if (!htmlCode.trim()) {
                alert("لا يوجد كود HTML للعرض!");
                return;
            }

            const blob = new Blob([htmlCode], { type: "text/html" });
            const url = URL.createObjectURL(blob);

            window.open(url, "_blank");
        }

        function previewAllWeb() {
            const allWebCode = document.getElementById("allWebCode").value;
            if (!allWebCode.trim()) {
                alert("لا يوجد كود HTML كامل للعرض!");
                return;
            }

            const blob = new Blob([allWebCode], { type: "text/html" });
            const url = URL.createObjectURL(blob);

            window.open(url, "_blank");
        }
    </script>

</body>
</html>
