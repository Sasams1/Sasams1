<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة جلب أكواد المواقع</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* أنيميشن دخول الصفحة */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أنيميشن للأزرار */
        @keyframes buttonHover {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            animation: fadeIn 0.8s ease-in-out;
            user-select: none; /* منع النسخ */
        }

        body.light-mode {
            background: #f4f4f4;
            color: #000;
        }

        /* تحسين الـ Toolbar */
        .toolbar {
            background: rgba(34, 34, 34, 0.7); /* شفافية */
            backdrop-filter: blur(10px); /* تأثير blur */
            padding: 10px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        body.light-mode .toolbar {
            background: rgba(255, 255, 255, 0.7); /* لون فاتح للوضع النهاري */
        }

        .toolbar .name {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
        }

        .toolbar .buttons button {
            background: #00aaff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
            animation: buttonHover 0.5s ease-in-out;
        }

        .toolbar .buttons button:hover {
            background: #0088cc;
            animation: buttonHover 0.5s ease-in-out infinite;
        }

        /* المحتوى الرئيسي */
        .container {
            margin-top: 20px;
            padding-bottom: 60px; /* إضافة مساحة أسفل الصفحة لتجنب تغطية الحقوق */
            animation: slideUp 0.8s ease-in-out;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            resize: none;
        }

        button {
            background: #00aaff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
            animation: buttonHover 0.5s ease-in-out;
        }

        button:hover {
            background: #0088cc;
            animation: buttonHover 0.5s ease-in-out infinite;
        }

        /* حقوق الملكية */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(34, 34, 34, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #fff;
            z-index: 999; /* تأكد من أنه تحت الـ Toolbar */
        }

        body.light-mode .footer {
            background: rgba(255, 255, 255, 0.7);
            color: #000;
        }

        /* زر التمرير إلى الأعلى */
        .scroll-to-top {
            position: fixed;
            bottom: 70px; /* فوق حقوق الملكية */
            right: 20px;
            background: #00aaff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            z-index: 1000;
        }

        .scroll-to-top:hover {
            background: #0088cc;
        }

        .preview-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            background: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.5s ease-in-out;
        }

        .preview-header {
            background: #222;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 15px 15px 0 0;
        }

        .preview-header button {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 8px;
        }

        .preview-header button:hover {
            background: #cc0000;
        }

        .preview-iframe {
            width: 100%;
            height: 92%;
            border: none;
            border-radius: 0 0 15px 15px;
        }
    </style>
</head>
<body>

    <!-- شريط الأدوات -->
    <div class="toolbar">
        <div class="name">مصطفى حسين</div>
        <div class="buttons">
            <button onclick="toggleTheme()">🌙</button>
            <button onclick="translateText()">English</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <h1 class="text-center mb-4">أداة جلب أكواد المواقع</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <input type="text" id="urlInput" class="form-control mb-3" placeholder="أدخل رابط الموقع">
                <button class="btn btn-primary w-100" onclick="fetchWebsiteCode()">إرسال</button>

                <h2 class="mt-4">كود HTML:</h2>
                <textarea id="htmlCode" readonly></textarea>
                <button onclick="copyText('htmlCode')">نسخ HTML</button>
                <button onclick="previewHTML()">معاينة HTML</button>

                <h2 class="mt-4">كود CSS:</h2>
                <textarea id="cssCode" readonly></textarea>
                <button onclick="copyText('cssCode')">نسخ CSS</button>

                <h2 class="mt-4">كود JavaScript:</h2>
                <textarea id="jsCode" readonly></textarea>
                <button onclick="copyText('jsCode')">نسخ JavaScript</button>

                <h2 class="mt-4">All Web (ملف HTML كامل):</h2>
                <textarea id="allWebCode" readonly></textarea>
                <button onclick="copyText('allWebCode')">نسخ All Web</button>
                <button id="previewAllWebButton" onclick="previewAllWeb()">معاينة All Web</button>
            </div>
        </div>
    </div>

    <!-- زر التمرير إلى الأعلى -->
    <button class="scroll-to-top" onclick="scrollToTop()">↑</button>

    <!-- حقوق الملكية -->
    <div class="footer">
        © 2025 مصطفى حسين. جميع الحقوق محفوظة.
    </div>

    <!-- صندوق المعاينة -->
    <div class="preview-container" id="previewContainer">
        <div class="preview-header">
            <span>معاينة الموقع</span>
            <button onclick="closePreview()">✖</button>
        </div>
        <iframe class="preview-iframe" id="previewFrame"></iframe>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiKey = "476c34e4da724c3eb2958291ea60e107b1df11c9706";

        async function fetchWebsiteCode() {
            const url = document.getElementById("urlInput").value;
            if (!url) {
                alert("الرجاء إدخال رابط الموقع!");
                return;
            }

            try {
                const response = await fetch(`https://api.scrape.do?token=${apiKey}&url=${encodeURIComponent(url)}`);
                const data = await response.text();

                document.getElementById("htmlCode").value = data;
                extractCSS_JS(data);
                generateAllWeb();
            } catch (error) {
                console.error("حدث خطأ:", error);
            }
        }

        function extractCSS_JS(html) {
            const cssMatches = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)];
            const jsMatches = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];

            document.getElementById("cssCode").value = cssMatches.length ? cssMatches.map(m => m[1]).join("\n") : "لا يوجد CSS داخلي";
            document.getElementById("jsCode").value = jsMatches.length ? jsMatches.map(m => m[1]).join("\n") : "لا يوجد JavaScript داخلي";
        }

        function generateAllWeb() {
            const htmlContent = document.getElementById("htmlCode").value;
            const cssContent = document.getElementById("cssCode").value;
            const jsContent = document.getElementById("jsCode").value;

            const fullHTML = `<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الموقع</title>
    <style>${cssContent}</style>
</head>
<body>
    ${htmlContent}
    <script>${jsContent}<\/script>
</body>
</html>`;

            document.getElementById("allWebCode").value = fullHTML;
        }

        function copyText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand("copy");
            alert("تم النسخ!");
        }

        function previewHTML() {
            const htmlCode = document.getElementById("htmlCode").value;
            const previewContainer = document.getElementById("previewContainer");
            const previewFrame = document.getElementById("previewFrame");

            if (!htmlCode) {
                alert("لا يوجد محتوى لمعاينته!");
                return;
            }

            previewContainer.style.display = "block";
            previewFrame.srcdoc = htmlCode;
        }

        function previewAllWeb() {
            const allWebCode = document.getElementById("allWebCode").value;
            const previewContainer = document.getElementById("previewContainer");
            const previewFrame = document.getElementById("previewFrame");

            if (!allWebCode) {
                alert("لا يوجد محتوى لمعاينته!");
                return;
            }

            previewContainer.style.display = "block";
            previewFrame.srcdoc = allWebCode;
        }

        function closePreview() {
            document.getElementById("previewContainer").style.display = "none";
        }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            const themeToggle = document.querySelector('.toolbar .buttons button');
            themeToggle.textContent = body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        function translateText() {
            const elements = document.querySelectorAll('h1, h2, button, .name');
            const translateButton = document.querySelector('.buttons button:nth-child(2)');
            const isEnglish = translateButton.textContent === 'English';

            elements.forEach(element => {
                if (element.textContent.includes('أداة جلب أكواد المواقع')) {
                    element.textContent = isEnglish ? 'Website Code Fetcher Tool' : 'أداة جلب أكواد المواقع';
                } else if (element.textContent.includes('إرسال')) {
                    element.textContent = isEnglish ? 'Submit' : 'إرسال';
                } else if (element.textContent.includes('نسخ HTML')) {
                    element.textContent = isEnglish ? 'Copy HTML' : 'نسخ HTML';
                } else if (element.textContent.includes('معاينة HTML')) {
                    element.textContent = isEnglish ? 'Preview HTML' : 'معاينة HTML';
                } else if (element.textContent.includes('نسخ CSS')) {
                    element.textContent = isEnglish ? 'Copy CSS' : 'نسخ CSS';
                } else if (element.textContent.includes('نسخ JavaScript')) {
                    element.textContent = isEnglish ? 'Copy JavaScript' : 'نسخ JavaScript';
                } else if (element.textContent.includes('All Web')) {
                    element.textContent = isEnglish ? 'All Web' : 'All Web';
                } else if (element.textContent.includes('معاينة All Web')) {
                    element.textContent = isEnglish ? 'Preview All Web' : 'معاينة All Web';
                } else if (element.textContent.includes('English')) {
                    element.textContent = isEnglish ? 'العربية' : 'English';
                }
            });

            // تحديث زر معاينة All Web
            const previewAllWebButton = document.getElementById('previewAllWebButton');
            previewAllWebButton.textContent = isEnglish ? 'Preview All Web' : 'معاينة All Web';
        }

        // زر التمرير إلى الأعلى
        window.onscroll = function() {
            const scrollButton = document.querySelector('.scroll-to-top');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                scrollButton.style.display = 'block';
            } else {
                scrollButton.style.display = 'none';
            }
        };

        function scrollToTop() {
            document.body.scrollTop = 0; // لـ Safari
            document.documentElement.scrollTop = 0; // لـ Chrome, Firefox, IE, Opera
        }
    </script>
</body>
</html>
